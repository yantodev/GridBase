name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned Spark JDBC test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/gridbase-spark"
          "$RUNNER_TEMP/gridbase-spark/bin/python" -m pip install --disable-pip-version-check pyspark==3.5.6
          "$RUNNER_TEMP/gridbase-spark/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import pyspark
          spark = Path(pyspark.__file__).parent
          assert (spark / 'jars/hive-jdbc-2.3.9.jar').is_file()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'SPARK_HOME={spark}\n')
          PY
      - name: Run all tests and checks
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/gridbase-tests"
          mkdir -p "$TMPDIR"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$TMPDIR"
          npm test
          npm run check

  publish:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Create missing annotated tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: npm run release:publish
