openapi: 3.0.3
info:
  title: GridBase API
  version: 1.3.0
  description: >-
    Java JDBC APIs for Spark Thrift/Hive, PostgreSQL and MySQL. Browser database
    and token-management APIs require the verified GitHub session cookie; /mcp
    instead requires an account-issued bearer token and never uses cookies to
    authenticate. JSON mutations enforce APP_URL origin protections. Browser
    X-GridBase-Account binds a tab to its session account and is mandatory for
    token management; it never selects another owner. Saved profiles persist
    encrypted and restore disconnected without a default; MCP uses only explicit
    saved-profile grants independently of Connected state. read_only requires
    dedicated externally provisioned read-only credentials for every database
    type plus structural SQL policy; full_access is SQL access, not app admin.
    Profile-generation changes invalidate prior grants. Audit persists SQL text
    including unredacted literals/comments, not result rows or bearer secrets.
    SQL is visible only to its owner or audit admins; audit admin does not grant
    connection access. Durable intent precedes JDBC. Final audit failures preserve
    actual results with an incomplete warning; MCP includes requestId and
    auditIncomplete in tool metadata. HTTP 200 can carry MCP tool failure. Never
    automatically retry uncertain writes. No automatic audit deletion. Legacy
    Node returns 501 for Activity, MCP and token-management APIs.
servers:
  - url: http://127.0.0.1:4173
security:
  - sessionCookie: []
paths:
  /mcp:
    post:
      security: [{ mcpBearer: [] }]
      summary: Stateless MCP Streamable HTTP JSON-RPC transport
      description: Bearer-only endpoint, never authenticated by browser cookies. Supports initialize, notifications/initialized, ping, tools/list and tools/call; no SSE/session, OAuth, resources or prompts. Versions 2025-03-26, 2025-06-18 and 2025-11-25. Tools list_connections, list_databases, list_tables, describe_table and execute_query use only explicitly granted saved profiles. read_only requires externally provisioned dedicated read-only credentials for all database types and structural SQL validation. full_access is SQL access, not application administration. JDBC calls have finite deadlines and independent row/metadata caps. Tool errors use isError even with HTTP 200; requestId/auditIncomplete are included in tool result metadata. Do not retry uncertain writes.
      parameters:
        - { in: header, name: MCP-Protocol-Version, schema: { type: string, enum: ['2025-03-26', '2025-06-18', '2025-11-25'] } }
        - { in: header, name: Accept, required: true, schema: { type: string }, description: Must accept application/json and text/event-stream }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Single JSON-RPC 2.0 request or notification; duplicate keys and batches are rejected; maximum 64 KiB }
      responses:
        '200': { description: JSON-RPC response; inspect error or tool isError rather than HTTP status alone }
        '202': { description: Accepted notification; no body }
        '400': { description: Invalid transport version or forbidden query string }
        '401': { description: 'Missing, expired or revoked bearer token' }
        '403': { description: Invalid Origin or insecure remote transport configuration }
        '405': { description: Only POST is supported; authenticated GET returns 405 }
        '406': { description: Required Accept media types missing }
        '413': { description: Request exceeds 64 KiB }
        '415': { description: JSON content type required }
        '503': { description: Token storage unavailable }
    get:
      security: [{ mcpBearer: [] }]
      summary: Streaming is not offered
      responses:
        '401': { description: Bearer authentication required }
        '405': { description: No SSE endpoint; Allow POST }
  /api/mcp/tokens:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: List the session account's tokens and safe saved connection choices
      description: X-GridBase-Account is mandatory on MCP management routes. Bearer tokens never authorize these APIs. List excludes raw tokens and database credentials.
      responses:
        '200':
          description: Safe token list, saved connection choices and configured MCP endpoint
          content:
            application/json:
              schema:
                type: object
                required: [tokens, connections, endpoint]
                properties:
                  tokens: { type: array, items: { $ref: '#/components/schemas/McpToken' } }
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        type: { type: string, enum: [hive, postgresql, mysql] }
                        mcpReadOnly: { type: boolean }
                  endpoint: { type: string, format: uri }
        '401': { description: Browser session required }
        '409': { description: Missing or mismatched expected account }
        '503': { description: Storage unavailable }
    post:
      summary: Create an immutable scoped token and reveal its secret once
      description: At most 20 active tokens per account. Choose explicit saved connections. Grants bind profile generation and read-only ceiling; changed credentials/settings invalidate old grants. Response is no-store. This declaration cannot create database privileges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scope, expiresInDays, connectionIds]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                scope: { type: string, enum: [read_only, full_access], default: read_only }
                expiresInDays: { type: integer, enum: [30, 90, 365], default: 30 }
                connectionIds: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string } }
      responses:
        '201':
          description: Created; secret is never returned by list endpoints
          content:
            application/json:
              schema:
                type: object
                required: [token, secret]
                properties:
                  token: { $ref: '#/components/schemas/McpToken' }
                  secret: { type: string, description: One-time bearer secret; never persist in browser storage or logs }
        '400': { description: 'Invalid scope, expiry, grant or active-token limit' }
        '401': { description: Browser session required }
        '403': { description: Origin or content type rejected }
        '404': { description: Unknown or foreign saved profile }
        '409': { description: Missing or mismatched expected account }
        '503': { description: Token or audit storage unavailable }
  /api/mcp/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Revoke a token owned by the current session account
      description: Revocation prevents subsequent tool calls but cannot undo an in-flight database operation. Workbench Disconnect does not revoke tokens.
      responses:
        '200': { description: Token revoked }
        '401': { description: Browser session required }
        '403': { description: Origin rejected }
        '404': { description: Token not found in this account }
        '409': { description: Missing or mismatched expected account }
        '503': { description: Storage unavailable }
  /api/auth/session:
    get:
      security: []
      summary: Return login availability and current GitHub identity without secrets
      responses:
        '200':
          description: Authentication status, also available when signed out
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, configured, user, capabilities]
                properties:
                  authenticated: { type: boolean }
                  configured: { type: boolean }
                  capabilities:
                    type: object
                    required: [auditAdmin]
                    properties:
                      auditAdmin: { type: boolean, description: Server-derived audit access; never a connection ownership override }
                  user:
                    type: object
                    nullable: true
                    required: [id, login]
                    properties:
                      id: { type: string, pattern: '^[1-9][0-9]{0,19}$', description: Stable numeric GitHub account ID }
                      login: { type: string }
  /auth/github:
    get:
      security: []
      summary: Begin GitHub OAuth with state and PKCE S256
      responses:
        '303': { description: 'Redirect to GitHub, the workspace, or login with a configuration error' }
  /auth/github/callback:
    get:
      security: []
      summary: Verify OAuth state, exchange code, and issue an eight-hour session cookie
      parameters:
        - { in: query, name: state, schema: { type: string } }
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: error, schema: { type: string } }
      responses:
        '303': { description: 'Redirect to workspace on success, otherwise login with a fixed error code' }
  /auth/logout:
    post:
      summary: Revoke the current session and clear its cookie
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Signed out }
        '401': { description: Session missing or expired }
        '403': { description: Origin or content type rejected }
  /healthz:
    get:
      security: []
      summary: Public liveness probe without database information
      responses:
        '200': { description: Server is running }
  /api/health:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: Return non-sensitive connection metadata
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/connections:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: List saved profiles and connected states without credentials
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200':
          description: Configured connections and legacy default ID
          content:
            application/json:
              schema:
                type: object
                required: [connections, defaultConnectionId]
                properties:
                  defaultConnectionId: { type: string, nullable: true }
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/Connection' }
    post:
      summary: Create or update a saved profile without opening a database connection
      description: An updated profile becomes disconnected until Connect is requested. A failed store write preserves the previous profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionRequest' }
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200':
          description: Configuration saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  connection: { $ref: '#/components/schemas/Connection' }
        '400': { description: Invalid configuration }
        '503': { description: Configuration storage unavailable }
  /api/connections/{connectionId}:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
      - in: path
        name: connectionId
        required: true
        schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,100}$' }
    get:
      summary: Load a saved profile for editing, including credentials
      description: Returns the full JDBC URL and password only on explicit edit. Responses use Cache-Control no-store. Only the verified owner account can access this profile; unknown or foreign IDs return 404.
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200':
          description: Saved configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionDetails' }
        '404': { description: Unknown profile }
        '503': { description: Configuration storage unavailable }
    delete:
      summary: Delete the saved profile and disconnect it
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200': { description: Profile deleted }
        '404': { description: Unknown profile }
        '503': { description: Configuration storage unavailable }
  /api/connections/test:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      summary: Test a JDBC connection without activating it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200': { description: Connection succeeded }
        '400': { description: Invalid connection details }
        '502': { description: Database rejected the connection }
        '503': { description: JDBC driver unavailable }
  /api/connections/connect:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      summary: Test, persist, and connect one JDBC profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200':
          description: Connection registered; other connections remain available
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  connection: { $ref: '#/components/schemas/Connection' }
        '400': { description: Invalid connection details }
        '502': { description: Database rejected the connection }
        '503': { description: JDBC driver unavailable }
  /api/connections/disconnect:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      summary: Disconnect the specified connection while retaining its saved configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId]
              properties:
                connectionId: { type: string }
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200': { description: Disconnected }
        '404': { description: Unknown connection ID }
  /api/query:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      summary: Execute a SQL statement through the selected Java JDBC connection
      description: Accepts one SELECT, WITH, SHOW, DESCRIBE, EXPLAIN, CREATE, INSERT, UPDATE, DELETE, MERGE, ALTER, DROP, or TRUNCATE statement. Successful statements without a result set return empty columns and rows, with updateCount when the driver reports an affected-row count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '404': { description: Unknown connection ID; no fallback to another connection }
        '200':
          description: Query result
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            X-GridBase-Audit-Warning: { $ref: '#/components/headers/AuditWarning' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          description: Invalid query
        '422':
          description: Unsupported SQL or more than one statement
        '502':
          description: The active JDBC driver rejected the SQL or could not execute it
        '503':
          description: Connection credentials or JDBC driver are unavailable
        '504':
          description: Query timed out
  /api/databases:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: List databases or schemas available to the selected connection
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      description: Uses Spark metadata SQL for Hive and DatabaseMetaData for PostgreSQL/MySQL.
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '404': { description: Unknown connection ID; no fallback to another connection }
        '200':
          description: Available databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabasesResponse'
        '502':
          description: JDBC or database server error
        '503':
          description: The connection or JDBC driver is unavailable
        '504':
          description: Database lookup timed out
  /api/tables:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: List tables in a database or schema
      description: Metadata uses a separate 10000-row ceiling, independent of DEFAULT_QUERY_LIMIT.
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/Namespace'
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '404': { description: Unknown connection ID; no fallback to another connection }
        '200':
          description: Available tables
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items: { type: string }
        '422': { description: Invalid identifier }
        '502': { description: Metadata lookup failed }
        '503': { description: Connection or driver unavailable }
        '504': { description: Lookup timed out }
  /api/columns:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: Describe typed columns of a table in the selected connection
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/Namespace'
        - in: query
          name: table
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '404': { description: Unknown connection ID; no fallback to another connection }
        '200':
          description: Unique columns without partition separator rows
          content:
            application/json:
              schema:
                type: object
                required: [columns]
                properties:
                  columns:
                    type: array
                    items:
                      type: object
                      required: [name, type, comment]
                      properties:
                        name: { type: string }
                        type: { type: string }
                        comment: { type: string }
        '422': { description: Invalid identifier }
        '502': { description: Metadata lookup failed }
        '503': { description: Connection or driver unavailable }
        '504': { description: Lookup timed out }
  /api/namespaces:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      deprecated: true
      summary: Deprecated alias for listing databases
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      description: Compatibility endpoint. Use /api/databases for new clients.
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '404': { description: Unknown connection ID; no fallback to another connection }
        '200':
          description: Available databases in the legacy namespaces field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespacesResponse'
        '502':
          description: Hive JDBC or Thrift Server error
        '503':
          description: Hive JDBC is not configured or the driver is unavailable
        '504':
          description: Database lookup timed out
  /api/activity:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: List activity and submitted query SQL for the verified account
      description: Default scope mine. Only audit admins can use scope all or the userId filter. Anonymous login failures are visible only in admin all scope. Reading audit does not open JDBC or load connection profiles and creates no recursive audit event. Unknown or duplicate filters are rejected. Cursor is an exclusive insertion ID in descending order; new records do not shift subsequent pages.
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [mine, all], default: mine } }
        - { in: query, name: userId, description: Admin only; requires scope all, schema: { type: string, pattern: '^[1-9][0-9]{0,19}$' } }
        - { in: query, name: from, description: Inclusive start in ISO 8601 UTC, schema: { type: string, format: date-time } }
        - { in: query, name: to, description: Inclusive end in ISO 8601 UTC, schema: { type: string, format: date-time } }
        - { in: query, name: action, schema: { $ref: '#/components/schemas/ActivityAction' } }
        - { in: query, name: outcome, schema: { type: string, enum: [pending, success, failure, denied] } }
        - { in: query, name: connectionId, schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,100}$' } }
        - { in: query, name: cursor, schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Stable page of activity records; nullable nextCursor ends pagination
          content:
            application/json:
              schema:
                type: object
                required: [events, nextCursor, isAdmin]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/ActivityEvent' } }
                  nextCursor: { type: string, nullable: true }
                  isAdmin: { type: boolean }
        '400': { description: 'Invalid filter, cursor, or range' }
        '401': { description: Session missing or expired }
        '403': { description: All-account scope or actor filter requires audit admin }
        '409': { description: Expected account differs from session }
        '503': { description: Audit storage unavailable }
        '501': { description: Node legacy does not support audit }
  /api/activity/users:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: List recorded actors for an audit administrator
      responses:
        '200':
          description: Latest recorded username snapshot for each stable account ID; excludes anonymous actors
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required: [id, login]
                      properties:
                        id: { type: string }
                        login: { type: string }
        '401': { description: Session missing or expired }
        '403': { description: Audit admin required }
        '409': { description: Expected account differs from session }
        '503': { description: Audit storage unavailable }
        '501': { description: Node legacy does not support audit }
  /api/activity/exports:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      summary: Record a browser export request for a successful query owned by the session
      description: Server fixes actor and source browser. Reference survives connection deletion. Does not verify actual file contents or completion of a local download. Unknown, foreign, failed, or pending query references return 404. Clients should block download on failure or incomplete-audit warning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queryRequestId, format, rowCount]
              properties:
                queryRequestId: { type: string, format: uuid }
                format: { type: string, enum: [csv, json] }
                rowCount: { type: integer, format: int64, minimum: 0, description: Cannot exceed query returnedRows }
      responses:
        '200':
          description: Export request recorded; not proof of file download
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            X-GridBase-Audit-Warning: { $ref: '#/components/headers/AuditWarning' }
          content:
            application/json:
              schema:
                type: object
                required: [ok, requestId]
                properties:
                  ok: { type: boolean }
                  requestId: { type: string, format: uuid }
        '400': { description: Invalid format or row count }
        '401': { description: Session missing or expired }
        '403': { description: Origin or content type rejected }
        '404': { description: Successful owned query not found }
        '409': { description: Expected account differs from session }
        '503': { description: Audit storage unavailable }
        '501': { description: Node legacy does not support audit }
components:
  headers:
    RequestId:
      description: Server-generated correlation ID; also returned in successful query JSON
      schema: { type: string, format: uuid }
    AuditWarning:
      description: Present only when final audit persistence failed. Original operation response is retained; pending does not mean SQL was not executed.
      schema: { type: string, enum: [incomplete] }
  securitySchemes:
    mcpBearer:
      type: http
      scheme: bearer
      description: Account-issued opaque MCP token, valid only on /mcp. Never send in a URL. Use HTTPS remotely or loopback HTTP locally.
    sessionCookie:
      type: apiKey
      in: cookie
      name: gridbase_session
      description: Opaque HttpOnly SameSite=Lax cookie created by GitHub OAuth. Secure on HTTPS. Database endpoints return 401 when missing or expired. Sessions access only the account's own workspace and expire after eight hours or a server restart.
  parameters:
    ExpectedAccount:
      in: header
      name: X-GridBase-Account
      required: false
      description: Expected stable GitHub session ID. A mismatch returns 409; this header never selects the connection owner.
      schema: { type: string, pattern: '^[1-9][0-9]{0,19}$' }
    ConnectionId:
      in: query
      name: connectionId
      description: Stable ID from /api/connections. Unknown or foreign-account IDs return 404 with no fallback.
      schema: { type: string, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$' }
    Namespace:
      in: query
      name: namespace
      required: true
      description: Nonblank identifier without control characters. Backticks are escaped by the server.
      schema: { type: string, minLength: 1, maxLength: 256 }
  schemas:
    McpToken:
      type: object
      description: Safe token metadata; no digest or bearer secret
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scope: { type: string, enum: [read_only, full_access] }
        createdAt: { type: integer, format: int64, description: Unix epoch milliseconds }
        expiresAt: { type: integer, format: int64, description: Unix epoch milliseconds }
        revokedAt: { type: integer, format: int64, nullable: true }
        grants:
          type: array
          items:
            type: object
            properties:
              connectionId: { type: string }
              generation: { type: string, format: uuid }
              readOnly: { type: boolean, description: Issuance-time policy ceiling; never silently upgraded }
    ActivityAction:
      type: string
      enum: [auth.start, auth.login, auth.logout, connection.list, connection.save, connection.test, connection.connect, connection.details, connection.disconnect, connection.delete, query.execute, metadata.databases, metadata.namespaces, metadata.tables, metadata.columns, result.export_requested, mcp.connections, token.create, token.revoke]
    ActivityEvent:
      type: object
      description: Append-only activity, independent of current connection profiles. Query activity includes submitted SQL text, which may contain sensitive literals and is visible only to its owner or audit admins. Pending means the outcome was not recorded, including process crashes or completion storage failures; SQL text does not prove execution succeeded.
      required: [id, requestId, userId, login, action, source, startedAt, outcome]
      properties:
        id: { type: string, description: Monotonic internal sequence serialized without JS integer precision loss }
        requestId: { type: string, format: uuid }
        userId: { type: string, nullable: true, description: Verified stable GitHub ID; null before identity verification }
        login: { type: string, nullable: true, description: Username snapshot at time of event }
        action: { $ref: '#/components/schemas/ActivityAction' }
        source: { type: string, enum: [server, browser, mcp] }
        tokenId: { type: string, nullable: true, description: Non-secret MCP token identifier }
        tokenName: { type: string, nullable: true, description: MCP token name snapshot }
        connectionId: { type: string, nullable: true }
        sqlOperation: { type: string, nullable: true }
        sqlHash: { type: string, nullable: true, description: SHA-256 fingerprint of submitted SQL }
        sqlText: { type: string, nullable: true, description: Submitted SQL for query.execute only; null for historical records and other actions. Includes literals and comments; not redacted. }
        queryRequestId: { type: string, nullable: true }
        exportFormat: { type: string, nullable: true, enum: [csv, json] }
        returnedRows: { type: integer, format: int64, nullable: true, minimum: 0 }
        affectedRows: { type: integer, format: int64, nullable: true, minimum: 0 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true, minimum: 0 }
        httpStatus: { type: integer, nullable: true }
        outcome: { type: string, enum: [pending, success, failure, denied] }
        code: { type: string, nullable: true, description: 'Safe fixed AUTH code, HTTP status code, or OK; no raw exception' }
    Connection:
      type: object
      required: [id, type, name, target, connected]
      properties:
        id: { type: string }
        type: { type: string, enum: [hive, postgresql, mysql] }
        name: { type: string }
        label: { type: string }
        target: { type: string, description: Redacted JDBC target without credentials }
        connected: { type: boolean }
        mcpReadOnly: { type: boolean, default: false }
    ConnectionDetails:
      allOf:
        - $ref: '#/components/schemas/ConnectionRequest'
        - type: object
          required: [id, jdbcUrl, password]
          properties:
            id: { type: string }
    QueryRequest:
      type: object
      required: [sql]
      properties:
        connectionId: { type: string, description: Stable connection ID. Unknown IDs return 404. }
        sql:
          type: string
          maxLength: 20000
          example: SELECT current_date;
    QueryResponse:
      type: object
      required: [requestId, columns, rows, rowCount, durationMs]
      properties:
        requestId: { type: string, format: uuid }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: { type: string, nullable: true }
        rowCount:
          type: integer
          description: Number of rows returned in the result set, not the number of affected rows.
        updateCount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Affected rows for a statement without a result set. Null for result sets or when the driver does not report a count.
        durationMs:
          type: integer
        truncated:
          type: boolean
    HealthResponse:
      type: object
      required: [status, configured, readOnly]
      properties:
        status: { type: string, enum: [ok, degraded] }
        configured: { type: boolean }
        readOnly: { type: boolean, enum: [false] }
        target: { type: string, nullable: true }
        databaseType: { type: string, nullable: true, enum: [hive, postgresql, mysql] }
        connectionName: { type: string, nullable: true }
    ConnectionRequest:
      type: object
      required: [type, username, password]
      properties:
        connectionId: { type: string, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$', description: Omit for a new ID; supply to reconnect the same connection. }
        type: { type: string, enum: [hive, postgresql, mysql] }
        name: { type: string, maxLength: 80 }
        host: { type: string, maxLength: 256 }
        port: { type: string, maxLength: 8 }
        database: { type: string, maxLength: 256 }
        jdbcUrl: { type: string, maxLength: 2048 }
        username: { type: string, maxLength: 256 }
        password: { type: string, maxLength: 2048, format: password }
        ssl: { type: boolean, default: false }
        mcpReadOnly: { type: boolean, default: false, description: Owner assertion that dedicated database and storage credentials were provisioned with read-only privileges; not permission verification }
    DatabasesResponse:
      type: object
      required: [databases]
      properties:
        databases:
          type: array
          items:
            type: string
          example: [default, analytics, warehouse]
    NamespacesResponse:
      deprecated: true
      type: object
      required: [namespaces]
      properties:
        namespaces:
          type: array
          items:
            type: string
          example: [default, analytics, warehouse]

