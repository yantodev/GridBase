openapi: 3.0.3
info:
  title: GridBase API
  version: 0.2.0
  description: Local API for querying and changing data through Java Hive JDBC. Connection credentials are loaded from the server's .env or process environment at startup. Explicit outer SQL LIMIT controls returned result size. Missing LIMIT or LIMIT NULL defaults to 50 returned rows (DEFAULT_QUERY_LIMIT). Browser pagination remains 10 rows. This default does not limit affected rows for write statements.
servers:
  - url: http://localhost:4173
paths:
  /api/health:
    get:
      summary: Return non-sensitive connection metadata
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/query:
    post:
      summary: Execute a SQL statement through Java Hive JDBC
      description: Accepts one SELECT, WITH, SHOW, DESCRIBE, EXPLAIN, CREATE, INSERT, UPDATE, DELETE, MERGE, ALTER, DROP, or TRUNCATE statement. Successful statements without a result set return empty columns and rows, with updateCount when the driver reports an affected-row count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          description: Invalid query
        '422':
          description: Unsupported SQL or more than one statement
        '502':
          description: Hive JDBC rejected the SQL or could not execute it
        '503':
          description: Connection credentials or Hive JDBC driver are unavailable
        '504':
          description: Query timed out
  /api/databases:
    get:
      summary: List databases available to the configured Spark session
      description: Runs the fixed read-only SHOW NAMESPACES IN s3tables statement through Java Hive JDBC and returns the namespaces as database entries for the sidebar.
      responses:
        '200':
          description: Available databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabasesResponse'
        '502':
          description: Hive JDBC or Thrift Server error
        '503':
          description: Hive JDBC is not configured or the driver is unavailable
        '504':
          description: Database lookup timed out
  /api/tables:
    get:
      summary: List tables in an s3tables namespace
      description: Metadata uses a separate 10000-row ceiling, independent of DEFAULT_QUERY_LIMIT.
      parameters:
        - $ref: '#/components/parameters/Namespace'
      responses:
        '200':
          description: Available tables
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items: { type: string }
        '422': { description: Invalid identifier }
        '502': { description: Metadata lookup failed }
        '503': { description: Connection or driver unavailable }
        '504': { description: Lookup timed out }
  /api/columns:
    get:
      summary: Describe typed columns of an s3tables table
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - in: query
          name: table
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Unique columns without partition separator rows
          content:
            application/json:
              schema:
                type: object
                required: [columns]
                properties:
                  columns:
                    type: array
                    items:
                      type: object
                      required: [name, type, comment]
                      properties:
                        name: { type: string }
                        type: { type: string }
                        comment: { type: string }
        '422': { description: Invalid identifier }
        '502': { description: Metadata lookup failed }
        '503': { description: Connection or driver unavailable }
        '504': { description: Lookup timed out }
  /api/namespaces:
    get:
      deprecated: true
      summary: Deprecated alias for listing databases
      description: Compatibility endpoint. Use /api/databases for new clients.
      responses:
        '200':
          description: Available databases in the legacy namespaces field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespacesResponse'
        '502':
          description: Hive JDBC or Thrift Server error
        '503':
          description: Hive JDBC is not configured or the driver is unavailable
        '504':
          description: Database lookup timed out
components:
  parameters:
    Namespace:
      in: query
      name: namespace
      required: true
      description: Nonblank identifier without control characters. Backticks are escaped by the server.
      schema: { type: string, minLength: 1, maxLength: 256 }
  schemas:
    QueryRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          maxLength: 20000
          example: SELECT current_date;
    QueryResponse:
      type: object
      required: [columns, rows, rowCount, durationMs]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: { type: string, nullable: true }
        rowCount:
          type: integer
          description: Number of rows returned in the result set, not the number of affected rows.
        updateCount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Affected rows for a statement without a result set. Null for result sets or when the driver does not report a count.
        durationMs:
          type: integer
        truncated:
          type: boolean
    HealthResponse:
      type: object
      required: [status, configured, readOnly]
      properties:
        status: { type: string, enum: [ok, degraded] }
        configured: { type: boolean }
        readOnly: { type: boolean, enum: [false] }
        target: { type: string, nullable: true }
    DatabasesResponse:
      type: object
      required: [databases]
      properties:
        databases:
          type: array
          items:
            type: string
          example: [default, analytics, warehouse]
    NamespacesResponse:
      deprecated: true
      type: object
      required: [namespaces]
      properties:
        namespaces:
          type: array
          items:
            type: string
          example: [default, analytics, warehouse]

