openapi: 3.0.3
info:
  title: GridBase API
  version: 1.1.0
  description: API for querying and changing data through Java JDBC, protected by GitHub OAuth sessions. All database endpoints require the HttpOnly session cookie. POST requests use application/json and mutations must originate from APP_URL. Connection profiles persist encrypted in SQLite and belong to the verified stable numeric GitHub account ID. All connection, health, query, and metadata operations are scoped to that account. Foreign connection IDs return 404 before opening JDBC. The optional X-GridBase-Account header binds a browser tab to its expected session account; a mismatch returns 409 before any operation and never selects an owner. Startup restores profiles as disconnected, without an implicit default. Requests without an ID use the first connection connected at runtime in that account; an unknown explicit ID never falls back. Supported databases are Spark Thrift/Hive, PostgreSQL, and MySQL. Java backend persists safe per-account audit metadata in data/audit.sqlite with no SQL text or result rows. AUDIT_ADMIN_IDS configures stable numeric GitHub audit admins without granting connection access. Database operations require a durable pending audit intent; failure returns 503 before JDBC. A completion-write failure preserves the operation response and adds X-GridBase-Audit-Warning incomplete; do not blindly retry writes. Auth audit is best effort during storage failures and logout always revokes the session. No automatic audit deletion. Node legacy returns 501 for Activity APIs.
servers:
  - url: http://127.0.0.1:4173
security:
  - sessionCookie: []
paths:
  /api/auth/session:
    get:
      security: []
      summary: Return login availability and current GitHub identity without secrets
      responses:
        '200':
          description: Authentication status, also available when signed out
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, configured, user, capabilities]
                properties:
                  authenticated: { type: boolean }
                  configured: { type: boolean }
                  capabilities:
                    type: object
                    required: [auditAdmin]
                    properties:
                      auditAdmin: { type: boolean, description: Server-derived audit access; never a connection ownership override }
                  user:
                    type: object
                    nullable: true
                    required: [id, login]
                    properties:
                      id: { type: string, pattern: '^[1-9][0-9]{0,19}$', description: Stable numeric GitHub account ID }
                      login: { type: string }
  /auth/github:
    get:
      security: []
      summary: Begin GitHub OAuth with state and PKCE S256
      responses:
        '303': { description: Redirect to GitHub, the workspace, or login with a configuration error }
  /auth/github/callback:
    get:
      security: []
      summary: Verify OAuth state, exchange code, and issue an eight-hour session cookie
      parameters:
        - { in: query, name: state, schema: { type: string } }
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: error, schema: { type: string } }
      responses:
        '303': { description: Redirect to workspace on success, otherwise login with a fixed error code }
  /auth/logout:
    post:
      summary: Revoke the current session and clear its cookie
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Signed out }
        '401': { description: Session missing or expired }
        '403': { description: Origin or content type rejected }
  /healthz:
    get:
      security: []
      summary: Public liveness probe without database information
      responses:
        '200': { description: Server is running }
  /api/health:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: Return non-sensitive connection metadata
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/connections:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: List saved profiles and connected states without credentials
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200':
          description: Configured connections and legacy default ID
          content:
            application/json:
              schema:
                type: object
                required: [connections, defaultConnectionId]
                properties:
                  defaultConnectionId: { type: string, nullable: true }
                  connections:
                    type: array
                    items: { $ref: '#/components/schemas/Connection' }
    post:
      summary: Create or update a saved profile without opening a database connection
      description: An updated profile becomes disconnected until Connect is requested. A failed store write preserves the previous profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionRequest' }
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200':
          description: Configuration saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  connection: { $ref: '#/components/schemas/Connection' }
        '400': { description: Invalid configuration }
        '503': { description: Configuration storage unavailable }
  /api/connections/{connectionId}:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
      - in: path
        name: connectionId
        required: true
        schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,100}$' }
    get:
      summary: Load a saved profile for editing, including credentials
      description: Returns the full JDBC URL and password only on explicit edit. Responses use Cache-Control no-store. Only the verified owner account can access this profile; unknown or foreign IDs return 404.
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200':
          description: Saved configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionDetails' }
        '404': { description: Unknown profile }
        '503': { description: Configuration storage unavailable }
    delete:
      summary: Delete the saved profile and disconnect it
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200': { description: Profile deleted }
        '404': { description: Unknown profile }
        '503': { description: Configuration storage unavailable }
  /api/connections/test:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      summary: Test a JDBC connection without activating it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200': { description: Connection succeeded }
        '400': { description: Invalid connection details }
        '502': { description: Database rejected the connection }
        '503': { description: JDBC driver unavailable }
  /api/connections/connect:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      summary: Test, persist, and connect one JDBC profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200':
          description: Connection registered; other connections remain available
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  connection: { $ref: '#/components/schemas/Connection' }
        '400': { description: Invalid connection details }
        '502': { description: Database rejected the connection }
        '503': { description: JDBC driver unavailable }
  /api/connections/disconnect:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      summary: Disconnect the specified connection while retaining its saved configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId]
              properties:
                connectionId: { type: string }
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '200': { description: Disconnected }
        '404': { description: Unknown connection ID }
  /api/query:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      summary: Execute a SQL statement through the selected Java JDBC connection
      description: Accepts one SELECT, WITH, SHOW, DESCRIBE, EXPLAIN, CREATE, INSERT, UPDATE, DELETE, MERGE, ALTER, DROP, or TRUNCATE statement. Successful statements without a result set return empty columns and rows, with updateCount when the driver reports an affected-row count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '404': { description: Unknown connection ID; no fallback to another connection }
        '200':
          description: Query result
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            X-GridBase-Audit-Warning: { $ref: '#/components/headers/AuditWarning' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          description: Invalid query
        '422':
          description: Unsupported SQL or more than one statement
        '502':
          description: The active JDBC driver rejected the SQL or could not execute it
        '503':
          description: Connection credentials or JDBC driver are unavailable
        '504':
          description: Query timed out
  /api/databases:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: List databases or schemas available to the selected connection
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      description: Uses Spark metadata SQL for Hive and DatabaseMetaData for PostgreSQL/MySQL.
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '404': { description: Unknown connection ID; no fallback to another connection }
        '200':
          description: Available databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabasesResponse'
        '502':
          description: JDBC or database server error
        '503':
          description: The connection or JDBC driver is unavailable
        '504':
          description: Database lookup timed out
  /api/tables:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: List tables in a database or schema
      description: Metadata uses a separate 10000-row ceiling, independent of DEFAULT_QUERY_LIMIT.
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/Namespace'
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '404': { description: Unknown connection ID; no fallback to another connection }
        '200':
          description: Available tables
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items: { type: string }
        '422': { description: Invalid identifier }
        '502': { description: Metadata lookup failed }
        '503': { description: Connection or driver unavailable }
        '504': { description: Lookup timed out }
  /api/columns:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: Describe typed columns of a table in the selected connection
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/Namespace'
        - in: query
          name: table
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '404': { description: Unknown connection ID; no fallback to another connection }
        '200':
          description: Unique columns without partition separator rows
          content:
            application/json:
              schema:
                type: object
                required: [columns]
                properties:
                  columns:
                    type: array
                    items:
                      type: object
                      required: [name, type, comment]
                      properties:
                        name: { type: string }
                        type: { type: string }
                        comment: { type: string }
        '422': { description: Invalid identifier }
        '502': { description: Metadata lookup failed }
        '503': { description: Connection or driver unavailable }
        '504': { description: Lookup timed out }
  /api/namespaces:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      deprecated: true
      summary: Deprecated alias for listing databases
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      description: Compatibility endpoint. Use /api/databases for new clients.
      responses:
        '409': { description: 'Session account differs from X-GridBase-Account. Reload before retrying.' }
        '404': { description: Unknown connection ID; no fallback to another connection }
        '200':
          description: Available databases in the legacy namespaces field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespacesResponse'
        '502':
          description: Hive JDBC or Thrift Server error
        '503':
          description: Hive JDBC is not configured or the driver is unavailable
        '504':
          description: Database lookup timed out
  /api/activity:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: List safe activity metadata for the verified account
      description: Default scope mine. Only audit admins can use scope all or the userId filter. Anonymous login failures are visible only in admin all scope. Reading audit does not open JDBC or load connection profiles and creates no recursive audit event. Unknown or duplicate filters are rejected. Cursor is an exclusive insertion ID in descending order; new records do not shift subsequent pages.
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [mine, all], default: mine } }
        - { in: query, name: userId, description: Admin only; requires scope all, schema: { type: string, pattern: '^[1-9][0-9]{0,19}$' } }
        - { in: query, name: from, description: Inclusive start in ISO 8601 UTC, schema: { type: string, format: date-time } }
        - { in: query, name: to, description: Inclusive end in ISO 8601 UTC, schema: { type: string, format: date-time } }
        - { in: query, name: action, schema: { $ref: '#/components/schemas/ActivityAction' } }
        - { in: query, name: outcome, schema: { type: string, enum: [pending, success, failure, denied] } }
        - { in: query, name: connectionId, schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,100}$' } }
        - { in: query, name: cursor, schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Stable page of activity records; nullable nextCursor ends pagination
          content:
            application/json:
              schema:
                type: object
                required: [events, nextCursor, isAdmin]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/ActivityEvent' } }
                  nextCursor: { type: string, nullable: true }
                  isAdmin: { type: boolean }
        '400': { description: Invalid filter, cursor, or range }
        '401': { description: Session missing or expired }
        '403': { description: All-account scope or actor filter requires audit admin }
        '409': { description: Expected account differs from session }
        '503': { description: Audit storage unavailable }
        '501': { description: Node legacy does not support audit }
  /api/activity/users:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      summary: List recorded actors for an audit administrator
      responses:
        '200':
          description: Latest recorded username snapshot for each stable account ID; excludes anonymous actors
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required: [id, login]
                      properties:
                        id: { type: string }
                        login: { type: string }
        '401': { description: Session missing or expired }
        '403': { description: Audit admin required }
        '409': { description: Expected account differs from session }
        '503': { description: Audit storage unavailable }
        '501': { description: Node legacy does not support audit }
  /api/activity/exports:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      summary: Record a browser export request for a successful query owned by the session
      description: Server fixes actor and source browser. Reference survives connection deletion. Does not verify actual file contents or completion of a local download. Unknown, foreign, failed, or pending query references return 404. Clients should block download on failure or incomplete-audit warning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queryRequestId, format, rowCount]
              properties:
                queryRequestId: { type: string, format: uuid }
                format: { type: string, enum: [csv, json] }
                rowCount: { type: integer, format: int64, minimum: 0, description: Cannot exceed query returnedRows }
      responses:
        '200':
          description: Export request recorded; not proof of file download
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            X-GridBase-Audit-Warning: { $ref: '#/components/headers/AuditWarning' }
          content:
            application/json:
              schema:
                type: object
                required: [ok, requestId]
                properties:
                  ok: { type: boolean }
                  requestId: { type: string, format: uuid }
        '400': { description: Invalid format or row count }
        '401': { description: Session missing or expired }
        '403': { description: Origin or content type rejected }
        '404': { description: Successful owned query not found }
        '409': { description: Expected account differs from session }
        '503': { description: Audit storage unavailable }
        '501': { description: Node legacy does not support audit }
components:
  headers:
    RequestId:
      description: Server-generated correlation ID; also returned in successful query JSON
      schema: { type: string, format: uuid }
    AuditWarning:
      description: Present only when final audit persistence failed. Original operation response is retained; pending does not mean SQL was not executed.
      schema: { type: string, enum: [incomplete] }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gridbase_session
      description: Opaque HttpOnly SameSite=Lax cookie created by GitHub OAuth. Secure on HTTPS. Database endpoints return 401 when missing or expired. Sessions access only the account's own workspace and expire after eight hours or a server restart.
  parameters:
    ExpectedAccount:
      in: header
      name: X-GridBase-Account
      required: false
      description: Expected stable GitHub session ID. A mismatch returns 409; this header never selects the connection owner.
      schema: { type: string, pattern: '^[1-9][0-9]{0,19}$' }
    ConnectionId:
      in: query
      name: connectionId
      description: Stable ID from /api/connections. Unknown or foreign-account IDs return 404 with no fallback.
      schema: { type: string, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$' }
    Namespace:
      in: query
      name: namespace
      required: true
      description: Nonblank identifier without control characters. Backticks are escaped by the server.
      schema: { type: string, minLength: 1, maxLength: 256 }
  schemas:
    ActivityAction:
      type: string
      enum: [auth.start, auth.login, auth.logout, connection.list, connection.save, connection.test, connection.connect, connection.details, connection.disconnect, connection.delete, query.execute, metadata.databases, metadata.namespaces, metadata.tables, metadata.columns, result.export_requested]
    ActivityEvent:
      type: object
      description: Safe append-only activity metadata, independent of current connection profiles. Pending means the outcome was not recorded, including process crashes or completion storage failures.
      required: [id, requestId, userId, login, action, source, startedAt, outcome]
      properties:
        id: { type: string, description: Monotonic internal sequence serialized without JS integer precision loss }
        requestId: { type: string, format: uuid }
        userId: { type: string, nullable: true, description: Verified stable GitHub ID; null before identity verification }
        login: { type: string, nullable: true, description: Username snapshot at time of event }
        action: { $ref: '#/components/schemas/ActivityAction' }
        source: { type: string, enum: [server, browser] }
        connectionId: { type: string, nullable: true }
        sqlOperation: { type: string, nullable: true }
        sqlHash: { type: string, nullable: true, description: SHA-256 fingerprint of submitted SQL; no SQL text }
        queryRequestId: { type: string, nullable: true }
        exportFormat: { type: string, nullable: true, enum: [csv, json] }
        returnedRows: { type: integer, format: int64, nullable: true, minimum: 0 }
        affectedRows: { type: integer, format: int64, nullable: true, minimum: 0 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true, minimum: 0 }
        httpStatus: { type: integer, nullable: true }
        outcome: { type: string, enum: [pending, success, failure, denied] }
        code: { type: string, nullable: true, description: Safe fixed AUTH code, HTTP status code, or OK; no raw exception }
    Connection:
      type: object
      required: [id, type, name, target, connected]
      properties:
        id: { type: string }
        type: { type: string, enum: [hive, postgresql, mysql] }
        name: { type: string }
        label: { type: string }
        target: { type: string, description: Redacted JDBC target without credentials }
        connected: { type: boolean }
    ConnectionDetails:
      allOf:
        - $ref: '#/components/schemas/ConnectionRequest'
        - type: object
          required: [id, jdbcUrl, password]
          properties:
            id: { type: string }
    QueryRequest:
      type: object
      required: [sql]
      properties:
        connectionId: { type: string, description: Stable connection ID. Unknown IDs return 404. }
        sql:
          type: string
          maxLength: 20000
          example: SELECT current_date;
    QueryResponse:
      type: object
      required: [requestId, columns, rows, rowCount, durationMs]
      properties:
        requestId: { type: string, format: uuid }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: { type: string, nullable: true }
        rowCount:
          type: integer
          description: Number of rows returned in the result set, not the number of affected rows.
        updateCount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Affected rows for a statement without a result set. Null for result sets or when the driver does not report a count.
        durationMs:
          type: integer
        truncated:
          type: boolean
    HealthResponse:
      type: object
      required: [status, configured, readOnly]
      properties:
        status: { type: string, enum: [ok, degraded] }
        configured: { type: boolean }
        readOnly: { type: boolean, enum: [false] }
        target: { type: string, nullable: true }
        databaseType: { type: string, nullable: true, enum: [hive, postgresql, mysql] }
        connectionName: { type: string, nullable: true }
    ConnectionRequest:
      type: object
      required: [type, username, password]
      properties:
        connectionId: { type: string, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$', description: Omit for a new ID; supply to reconnect the same connection. }
        type: { type: string, enum: [hive, postgresql, mysql] }
        name: { type: string, maxLength: 80 }
        host: { type: string, maxLength: 256 }
        port: { type: string, maxLength: 8 }
        database: { type: string, maxLength: 256 }
        jdbcUrl: { type: string, maxLength: 2048 }
        username: { type: string, maxLength: 256 }
        password: { type: string, maxLength: 2048, format: password }
        ssl: { type: boolean, default: false }
    DatabasesResponse:
      type: object
      required: [databases]
      properties:
        databases:
          type: array
          items:
            type: string
          example: [default, analytics, warehouse]
    NamespacesResponse:
      deprecated: true
      type: object
      required: [namespaces]
      properties:
        namespaces:
          type: array
          items:
            type: string
          example: [default, analytics, warehouse]

