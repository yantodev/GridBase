openapi: 3.0.3
info:
  title: Thrift Query Workbench API
  version: 0.1.0
  description: Local API for executing read-only SQL through Java Hive JDBC.
servers:
  - url: http://localhost:4173
paths:
  /api/health:
    get:
      summary: Return non-sensitive connection metadata
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/setup:
    post:
      summary: Configure the in-memory JDBC session
      description: Accepts the JDBC URL, username, and password from the local setup screen. Values are held only by the running Java process and are never returned in the response or stored in browser storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '200':
          description: Session configured; response contains the same non-sensitive health metadata as GET /api/health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Invalid JSON request
        '422':
          description: Missing or invalid JDBC setup values
  /api/query:
    post:
      summary: Execute a read-only SQL query through Java Hive JDBC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          description: Invalid query
        '422':
          description: Query is not allowed in read-only mode
        '504':
          description: Query timed out
  /api/databases:
    get:
      summary: List databases available to the configured Spark session
      description: Runs the fixed read-only SHOW NAMESPACES IN s3tables statement through Java Hive JDBC and returns the namespaces as database entries for the sidebar.
      responses:
        '200':
          description: Available databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabasesResponse'
        '502':
          description: Hive JDBC or Thrift Server error
        '503':
          description: Hive JDBC is not configured or the driver is unavailable
        '504':
          description: Database lookup timed out
  /api/namespaces:
    get:
      deprecated: true
      summary: Deprecated alias for listing databases
      description: Compatibility endpoint. Use /api/databases for new clients.
      responses:
        '200':
          description: Available databases in the legacy namespaces field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespacesResponse'
        '502':
          description: Hive JDBC or Thrift Server error
        '503':
          description: Hive JDBC is not configured or the driver is unavailable
        '504':
          description: Database lookup timed out
components:
  schemas:
    SetupRequest:
      type: object
      required: [jdbcUrl, username, password]
      properties:
        jdbcUrl:
          type: string
          maxLength: 2048
          pattern: '^jdbc:hive2://'
          example: jdbc:hive2://spark.example:443/default;transportMode=http
        username:
          type: string
          maxLength: 256
          example: reader
        password:
          type: string
          maxLength: 2048
          format: password
          writeOnly: true
    QueryRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          maxLength: 20000
          example: SELECT current_date;
    QueryResponse:
      type: object
      required: [columns, rows, rowCount, durationMs]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        rowCount:
          type: integer
        durationMs:
          type: integer
        truncated:
          type: boolean
    HealthResponse:
      type: object
      required: [status, configured, readOnly]
      properties:
        status: { type: string, enum: [ok, degraded] }
        configured: { type: boolean }
        readOnly: { type: boolean }
        target: { type: string, nullable: true }
    DatabasesResponse:
      type: object
      required: [databases]
      properties:
        databases:
          type: array
          items:
            type: string
          example: [default, analytics, warehouse]
    NamespacesResponse:
      deprecated: true
      type: object
      required: [namespaces]
      properties:
        namespaces:
          type: array
          items:
            type: string
          example: [default, analytics, warehouse]

