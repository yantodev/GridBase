services:
  thrift-query:
    build:
      context: .
      dockerfile: Dockerfile
    image: gridbase:local
    init: true
    ports:
      - "${PORT:-4173}:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      QUERY_TIMEOUT_MS: "${QUERY_TIMEOUT_MS:-30000}"
      DEFAULT_QUERY_LIMIT: "${DEFAULT_QUERY_LIMIT:-50}"
    restart: unless-stopped
    volumes:
      - gridbase-data:/app/data

volumes:
  gridbase-data:
